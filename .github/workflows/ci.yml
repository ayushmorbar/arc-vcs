name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-verify:
    name: test-lint-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      toolchain: stable # <-- Ensures $toolchain is available to all steps

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Typos check
        run: |
          cargo install typos-cli --locked --version 1.37.0
          typos --config ./typos.toml

      - name: Enforce architecture layering
        run: bash scripts/ci/enforce-layering.sh

      - name: Install cargo-diet
        run: cargo install cargo-diet --locked

      - name: Package size guardrails
        run: |
          bash scripts/ci/check-package-size.sh \
            crates/arc-core:300KB \
            crates/arc-cli:350KB \
            crates/arc-daemon:250KB \
            crates/arc-git-bridge:300KB

      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked

      # CI-safe policy verification via tests (no .arc bootstrap required)
      - name: Policy regression tests
        run: |
          cargo test -p arc-cli workspace_policy_audit_current_workspace -- --nocapture
          cargo test -p arc-cli governance_audit_current_workspace -- --nocapture
          cargo test -p arc-cli tooling_audit_current_workspace -- --nocapture
