name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-verify:
    name: test-lint-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      toolchain: stable  # <-- Ensures $toolchain is available to all steps

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked

      # CI-safe policy verification via tests (no .arc bootstrap required)
      - name: Policy regression tests
        run: |
          cargo test -p arc-cli workspace_policy_audit_current_workspace -- --nocapture
          cargo test -p arc-cli governance_audit_current_workspace -- --nocapture
          cargo test -p arc-cli tooling_audit_current_workspace -- --nocapture