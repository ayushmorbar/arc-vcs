name: release

on:
  release:
    types: [published]

jobs:
  preflight-release-guards:
    name: preflight-release-guards
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Ensure unique release tag
        run: bash scripts/ci/enforce-unique-tag.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install cargo-diet
        run: cargo install cargo-diet --locked

      - name: Package size preflight
        run: |
          bash scripts/ci/check-package-size.sh \
            crates/arc-core:300KB \
            crates/arc-cli:350KB \
            crates/arc-daemon:250KB \
            crates/arc-git-bridge:300KB

  build-release:
    needs: [preflight-release-guards]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}
