name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Preflight checks
        run: |
          bash scripts/ci/enforce-unique-tag.sh "$GITHUB_REF_NAME"
          bash scripts/ci/check-package-size.sh \
            "crates/arc-core:300KB" \
            "crates/arc-algebra:400KB" \
            "crates/arc-store-graph:300KB" \
            "crates/arc-daemon:400KB" \
            "crates/arc-cli:400KB"

  build:
    name: Build (${{ matrix.target }})
    needs: release-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Install cross-compilation tools
        run: |
          bash scripts/ci/install-cross-tools.sh "${{ matrix.target }}"

      - name: Build release binary
        run: bash scripts/ci/build-release.sh "${{ matrix.target }}"

      - name: Smoke test (arc --version)
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f arc ]; then ./arc --version; fi
          if [ -f arc.exe ]; then ./arc.exe --version; fi

      - name: Create checksums
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum arc arc.exe 2>/dev/null | tee SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign artifacts with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cd target/${{ matrix.target }}/release
          for f in arc arc.exe SHA256SUMS.txt; do
            [ -f "$f" ] && cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.cert" "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/arc
            target/${{ matrix.target }}/release/arc.exe
            target/${{ matrix.target }}/release/SHA256SUMS.txt
            target/${{ matrix.target }}/release/*.sig
            target/${{ matrix.target }}/release/*.cert
          if-no-files-found: error

  collect-subjects:
    name: Collect Subjects
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Compute SLSA subjects
        id: subjects
        run: |
          cd artifacts
          echo "subjects<<EOF" >> "$GITHUB_OUTPUT"
          find . -type f \( -name "arc" -o -name "arc.exe" \) -exec sha256sum {} \; | while read -r hash path; do
            name=$(basename "$path")
            echo "${hash}  ${name}"
          done >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA Provenance
    needs: collect-subjects
    permissions:
      actions: read
      id-token: write
      contents: write
    # zizmor: ignore[unpinned] — SLSA generator is a reusable workflow that breaks with SHA refs (slsa-framework/slsa-github-generator#4503)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base-subjects: ${{ needs.collect-subjects.outputs.subjects }}
      upload-assets: true
      draft-release: true

  github-release:
    name: GitHub Release
    needs: [build, collect-subjects]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          bash scripts/ci/generate-semantic-changelog.sh > CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: CHANGELOG_RELEASE.md
          draft: true
          generate_release_notes: false
          files: |
            artifacts/**/*
          fail_on_unmatched_files: false
