[package]
name = "arc-ai"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "AI orchestration, embeddings, and vector store for arc"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-store-types = { path = "../arc-store-types" }
arc-change = { path = "../arc-change" }
arc-revset = { path = "../arc-revset" }

anyhow = "1.0.102"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde_json = "1.0.149"
tokenizers = "0.22.2"
ort = "2.0.0-rc.12"
rusqlite = { version = "0.39.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.51.1", features = ["macros", "rt"] }
