[package]
name = "arc-ai"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "AI orchestration, embeddings, and vector store for arc"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-store-types = { path = "../arc-store-types" }
arc-change = { path = "../arc-change" }
arc-revset = { path = "../arc-revset" }

anyhow = "1.0.103"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde_json = "1.0.150"
tokenizers = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
