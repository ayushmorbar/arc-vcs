[package]
name = "arc-algebra-types"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Foundational algebra types for arc"

[features]
default = ["std"]
std = ["serde/std", "blake3/std"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
blake3 = { version = "1.8.5", default-features = false, features = ["serde"] }
