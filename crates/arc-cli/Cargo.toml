[package]
name = "arc-cli"
version = "0.1.0-beta.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc CLI orchestrator: repository engine, network sync, and the arc binary"

[lib]
name = "arc_cli"
path = "src/lib.rs"

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
arc-core = { path = "../arc-core" }
arc-lang = { path = "../arc-lang" }
arc-net = { path = "../arc-net" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
anyhow = "1.0"
blake3 = "1.8.3"
memmap2 = "0.9.10"
indicatif = "0.18.4"
comfy-table = "7.2.2"
owo-colors = "4.3.0"
bincode = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
ignore = "0.4.25"
directories = "6"
shlex = "1.3"
fs2 = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] }
similar = { version = "2.7.0", features = ["inline"] }

[dev-dependencies]
tempfile = "3.26.0"
