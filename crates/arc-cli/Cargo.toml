[package]
name = "arc-cli"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc CLI orchestrator: repository engine, network sync, and the arc binary"

[lib]
name = "arc_cli"
path = "src/lib.rs"

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
arc-core = { path = "../arc-core" }
arc-lang = { path = "../arc-lang" }
arc-net = { path = "../arc-net" }
arc-git-bridge = { path = "../arc-git-bridge" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
clap-markdown = "0.1.5"
clap_mangen = "0.3"
tokio = { version = "1.51.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
anyhow = "1.0"
blake3 = "1.8.3"
memmap2 = "0.9.10"
indicatif = "0.18.4"
comfy-table = "7.2.2"
owo-colors = "4.3.0"
bincode = "1.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
ignore = "0.4.25"
directories = "6"
shlex = "1.3"
fs2 = "0.4.3"
arc-swap = "1.9.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
similar = { version = "3.0.0", features = ["inline"] }
gix-features = { version = "0.46.2", features = ["parallel"] }
prodash = { version = "31.0.0", features = ["render-line", "render-line-crossterm", "render-tui", "render-tui-crossterm"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.3"

[dev-dependencies]
async-trait = "0.1.89"
