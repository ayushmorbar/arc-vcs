[package]
name = "arc-cli"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc CLI orchestrator: repository engine, network sync, and the arc binary"

[lib]
name = "arc_cli"
path = "src/lib.rs"

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
arc-ai = { path = "../arc-ai" }
arc-algebra = { path = "../arc-algebra" }
arc-algebra-types = { path = "../arc-algebra-types" }
arc-diagnostics = { path = "../arc-diagnostics" }
arc-change = { path = "../arc-change" }
arc-engine = { path = "../arc-engine" }
arc-git = { path = "../arc-git" }
arc-network = { path = "../arc-network" }
arc-policy = { path = "../arc-policy" }
arc-revset = { path = "../arc-revset" }
arc-transaction = { path = "../arc-transaction" }
arc-store-policy = { path = "../arc-store-policy" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-graph = { path = "../arc-store-graph" }
arc-store-types = { path = "../arc-store-types" }
arc-store-view = { path = "../arc-store-view" }
arc-lang = { path = "../arc-lang" }
arc-net = { path = "../arc-net" }
arc-core = { path = "../arc-core" }
arc-git-bridge = { path = "../arc-git-bridge" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
clap = { version = "4.6", features = ["derive", "color", "help"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
clap-markdown = "0.1.5"
clap_mangen = "0.3"
tokio = { version = "1.51.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
anyhow = "1.0"
blake3 = "1.8.3"
memmap2 = "0.9.10"
indicatif = "0.18.4"
tracing-indicatif = "0.3.13"
comfy-table = "7.2.2"
owo-colors = "4.3.0"
bincode = "1.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
ignore = "0.4.25"
directories = "6"
shlex = "1.3"
fs2 = "0.4.3"
arc-swap = "1.9.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
similar = { version = "3.0.0", features = ["inline"] }
gix-features = { version = "0.46.2", features = ["parallel"] }
prodash = { version = "31.0.0", features = ["render-line", "render-line-crossterm", "render-tui", "render-tui-crossterm"] }
tempfile = "3.27.0"
ctrlc = "3.5.2"
rpassword = "7.4.0"
inquire = "0.9.4"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[dev-dependencies]
async-trait = "0.1.89"
arc-testtools = { path = "../arc-testtools" }
assert_cmd = "2.2.0"
predicates = "3.1.4"
