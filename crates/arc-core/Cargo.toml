[package]
name = "arc-core"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc algebraic foundation: atoms, CAS, change graph, cryptographic identity"

[dependencies]
arc-content-hash-derive = { path = "../arc-content-hash-derive" }
blake3 = "1.8.4"
arc-swap = "1.9.0"
dashmap = "6.1.0"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.2"
memmap2 = "0.9.10"
thiserror = "2.0.18"
anyhow = "1.0.102"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0.149"
directories = "6.0.0"
ignore = "0.4.25"
flate2 = "1.1.9"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
fastembed = "5.13.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
gix-features = { version = "0.46.2", features = ["parallel"] }
pest = "2.8.6"
pest_derive = "2.8.6"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.51.0", features = ["rt", "macros"] }
