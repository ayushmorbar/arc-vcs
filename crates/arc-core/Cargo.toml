[package]
name = "arc-core"
version = "2026.07.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc algebraic foundation: atoms, CAS, change graph, cryptographic identity"

[features]
default = ["native"]
native = [
	"ai-resolver",
	"git-compat",
	"dep:arc-network",
	"dep:arc-store-policy",
	"dep:directories",
	"dep:serde_json",
]
git-compat = ["dep:arc-git"]
ai-resolver = ["dep:arc-ai"]
wasm = []
redb-metadata = ["dep:redb"]

[dependencies]
arc-algebra = { path = "../arc-algebra" }
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-engine = { path = "../arc-engine" }
arc-revset = { path = "../arc-revset" }
arc-error = { path = "../arc-error" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-graph = { path = "../arc-store-graph" }
arc-store-view = { path = "../arc-store-view" }
arc-store-types = { path = "../arc-store-types" }
blake3 = "1.8.5"
arc-swap = "1.9.0"
dashmap = "6.2.1"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
thiserror = "2.0.18"
anyhow = "1.0.103"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ignore = "0.4.25"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
redb = { version = "4.0.0", optional = true }
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arc-ai = { path = "../arc-ai", optional = true }
arc-git = { path = "../arc-git", optional = true }
arc-network = { path = "../arc-network", optional = true }
arc-store-policy = { path = "../arc-store-policy", optional = true }
serde_json = { version = "1.0.150", optional = true }
directories = { version = "6.0.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["rt", "macros"] }
proptest = "1.11.0"

[[bench]]
name = "core_ops"
harness = false
