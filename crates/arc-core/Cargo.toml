[package]
name = "arc-core"
version = "0.1.0"
edition = "2024"
description = "arc algebraic foundation: atoms, CAS, change graph, cryptographic identity"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
memmap2 = "0.9"
thiserror = "2"
anyhow = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1.0.149"
directories = "6.0.0"
ignore = "0.4.25"

[dev-dependencies]
tempfile = "3"
