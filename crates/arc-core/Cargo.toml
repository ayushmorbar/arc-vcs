[package]
name = "arc-core"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc algebraic foundation: atoms, CAS, change graph, cryptographic identity"

[dependencies]
blake3 = "1.8.3"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"
memmap2 = "0.9.10"
thiserror = "2.0.18"
anyhow = "1.0.102"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0.149"
directories = "6.0.0"
ignore = "0.4.25"
flate2 = "1.1.9"
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
tempfile = "3.26.0"
