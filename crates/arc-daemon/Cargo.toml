[package]
name = "arc-daemon"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "JSON-RPC daemon backend for IDE integrations"

[features]
default = []
rpc-server = [
	"dep:arc-algebra",
	"dep:arc-algebra-types",
	"dep:arc-change",
	"dep:arc-store-types",
	"dep:arc-store-view",
	"dep:serde",
	"dep:serde_json",
]

[dependencies]
tokio = { version = "1.53.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
anyhow = "1.0.103"
arc-algebra = { path = "../arc-algebra", optional = true }
arc-algebra-types = { path = "../arc-algebra-types", optional = true }
arc-change = { path = "../arc-change", optional = true }
arc-store-types = { path = "../arc-store-types", optional = true }
arc-store-view = { path = "../arc-store-view", optional = true }
arc-core = { path = "../arc-core", default-features = false, features = ["redb-metadata"] }
notify = "8.2.0"
arc-diagnostics = { path = "../arc-diagnostics" }
tracing = "0.1.44"
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
blake3 = "1.8.4"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.150"

[[test]]
name = "protocol"
required-features = ["rpc-server"]
