[package]
name = "arc-daemon"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "JSON-RPC daemon backend for IDE integrations"

[dependencies]
tokio = { version = "1.51.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
arc-algebra = { path = "../arc-algebra" }
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-store-types = { path = "../arc-store-types" }
arc-store-view = { path = "../arc-store-view" }
arc-cli = { path = "../arc-cli" }
notify = "8.2.0"

[dev-dependencies]
tempfile = "3.27.0"
