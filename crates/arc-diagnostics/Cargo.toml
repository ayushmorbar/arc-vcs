[package]
name = "arc-diagnostics"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Structured diagnostics and actionable hints for arc"

[dependencies]
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.24", features = ["json", "env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
