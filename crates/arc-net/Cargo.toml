[package]
name = "arc-net"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc HTTP transport layer: read-only CAS and view server"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-network = { path = "../arc-network" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-types = { path = "../arc-store-types" }
arc-store-view = { path = "../arc-store-view" }
axum = "0.8.9"
tokio = { version = "1.53.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"
blake3 = "1.8.5"
serde_json = "1.0.150"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1.89"
tokio-util = { version = "0.7.18", features = ["codec"] }
bytes = "1.12.1"
bincode = "3.0.0"
futures-util = "0.3.32"
tracing = "0.1.44"
thiserror = "2.0.18"

http-body-util = "0.1.3"

[dev-dependencies]
tokio-test = "0.4.5"
futures-util = "0.3.32"
tempfile = "3.27.0"
