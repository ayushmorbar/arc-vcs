[package]
name = "arc-net"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc HTTP transport layer: read-only CAS and view server"

[dependencies]
arc-core = { path = "../arc-core" }
axum = "0.8.8"
tokio = { version = "1.51.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
blake3 = "1.8.3"
serde_json = "1.0.149"

http-body-util = "0.1.3"
