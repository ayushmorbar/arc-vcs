[package]
name = "arc-net"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "arc HTTP transport layer: read-only CAS and view server"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-network = { path = "../arc-network" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-types = { path = "../arc-store-types" }
arc-store-view = { path = "../arc-store-view" }
axum = "0.8.8"
tokio = { version = "1.51.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
blake3 = "1.8.3"
serde_json = "1.0.149"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1.89"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.11.1"
bincode = "1.3.2"
futures-util = "0.3.32"

http-body-util = "0.1.3"

[dev-dependencies]
tokio-test = "0.4.5"
futures-util = "0.3.32"
tempfile = "3.27.0"
