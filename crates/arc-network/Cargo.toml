[package]
name = "arc-network"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CRDT sync transport protocol and blob transfer client for arc"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-store-types = { path = "../arc-store-types" }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
bytes = "1.11.1"
tracing = "0.1.44"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
