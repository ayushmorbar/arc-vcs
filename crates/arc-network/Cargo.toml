[package]
name = "arc-network"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CRDT sync transport protocol and blob transfer client for arc"

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-keyring = { path = "../arc-keyring" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-types = { path = "../arc-store-types" }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
bincode = "1.3.3"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
thiserror = "2.0.18"

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
