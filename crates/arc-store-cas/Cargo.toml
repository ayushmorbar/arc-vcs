[package]
name = "arc-store-cas"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Content-addressable storage and BLAKE3 hashing utilities for arc"

[features]
default = ["native-io"]
native-io = ["dep:memmap2"]

[lints]
workspace = true

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-store-types = { path = "../arc-store-types" }
blake3 = "1.8.5"
bincode = "3.0.0"
memmap2 = { version = "0.9.11", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"
thiserror = "2.0.18"
bytes = "1.12.1"
tracing = "0.1.44"
libc = "0.2.186"

[package.metadata.cargo-machete]
ignored = [
	# Enabled via feature forwarding for native-only paths.
	"memmap2",
]

[dev-dependencies]
tempfile = "3.27.0"
