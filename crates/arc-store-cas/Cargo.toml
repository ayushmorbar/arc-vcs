[package]
name = "arc-store-cas"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Content-addressable storage and BLAKE3 hashing utilities for arc"

[features]
default = ["native-io"]
native-io = ["dep:memmap2"]

[lints]
workspace = true

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-store-types = { path = "../arc-store-types" }
blake3 = "1.8.4"
bincode = "1.3.2"
memmap2 = { version = "0.9.10", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
bytes = "1.10.1"
tracing = "0.1.41"
libc = "0.2.184"

[package.metadata.cargo-machete]
ignored = [
	# Enabled via feature forwarding for native-only paths.
	"memmap2",
]

[dev-dependencies]
tempfile = "3.27.0"
