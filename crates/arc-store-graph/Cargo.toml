[package]
name = "arc-store-graph"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure DAG traversal, topology, and bisect state management for arc"

[features]
default = ["native-workers"]
native-workers = []

[lints]
workspace = true

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-store-types = { path = "../arc-store-types" }
dashmap = "6.1.0"
bitflags = "2.11.0"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
bincode = "3.0.0"
tracing = "0.1.44"

[dev-dependencies]
blake3 = "1.8.4"
tempfile = "3.27.0"
