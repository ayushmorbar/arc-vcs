[package]
name = "arc-store-graph"
version = "2026.7.19"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure DAG traversal, topology, and bisect state management for arc"

[features]
default = ["native-workers"]
native-workers = []

[lints]
workspace = true

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-store-cas = { path = "../arc-store-cas" }
arc-store-types = { path = "../arc-store-types" }
dashmap = "6.2.1"
bitflags = "2.13.1"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"
bincode = "1.3.3"
tracing = "0.1.44"

[dev-dependencies]
blake3 = "1.8.5"
tempfile = "3.27.0"
