[package]
name = "arc-store-types"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Foundational store types for arc"

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
directories = "6.0.0"
serde_json = "1.0.149"
bincode = "1.3.2"
blake3 = "1.8.4"

[dev-dependencies]
tempfile = "3.27.0"
