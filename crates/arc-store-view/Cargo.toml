[package]
name = "arc-store-view"
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Crash-consistent persistence for arc mutable views and operation log"

[lints]
workspace = true

[dependencies]
arc-algebra-types = { path = "../arc-algebra-types" }
arc-change = { path = "../arc-change" }
arc-store-types = { path = "../arc-store-types" }
arc-store-graph = { path = "../arc-store-graph" }
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.2"
anyhow = "1.0.102"
blake3 = "1.8.4"
dashmap = "6.1.0"
serde_json = "1.0.149"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
