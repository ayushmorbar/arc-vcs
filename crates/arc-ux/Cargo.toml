[package]
name = "arc-ux"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared output protocol and rendering primitives for arc CLI/TUI"

[dependencies]
arc-error = { path = "../arc-error" }
atty = "0.2.14"
console = "0.16.3"
indicatif = "0.18.4"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
blake3 = "1.8.3"