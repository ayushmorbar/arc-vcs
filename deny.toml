# cargo-deny configuration — used by `just audit` and `mise run check:audit`
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all workspace members
targets = []

# ── Advisories (CVE / RUSTSEC) ─────────────────────────────────────────────────
[advisories]
db-path   = "~/.cargo/advisory-db"
db-urls   = ["https://github.com/rustsec/advisory-db"]
version   = 2
ignore    = []   # add RUSTSEC IDs here to acknowledge known issues
unmaintained = "workspace"
yanked = "warn"
notice = "warn"

# ── Licenses ───────────────────────────────────────────────────────────────────
[licenses]
version          = 2
# Allowlist favors dual-license-compatible permissive licenses.
allow            = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "CC0-1.0"]
deny             = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]
copyleft         = "warn"
allow-osi-fsf-free = "neither"
default          = "deny"
confidence-threshold = 0.8

# ── Bans (duplicate crates / blocked crates) ───────────────────────────────────
[bans]
multiple-versions  = "warn"
wildcards          = "deny"   # no `*` version specs in Cargo.toml
highlight          = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
allow-build-scripts = []

# ── Sources ────────────────────────────────────────────────────────────────────
[sources]
unknown-registry    = "deny"
unknown-git         = "deny"
allow-registry      = ["https://github.com/rust-lang/crates.io-index"]
allow-git           = []